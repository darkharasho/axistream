name: Release

# Tag a release: git tag v0.1.0 && git push origin v0.1.0
# Gated on the test job; builds Linux (AppImage + deb), Windows (NSIS,
# unsigned) and macOS (dmg + zip, Developer ID signed + notarized), all
# uploaded to one draft release with their electron-updater feeds
# (latest-linux.yml / latest.yml / latest-mac.yml), then promoted once.
# Mac signing secrets came from 1Password via `gh secret set` (CSC_LINK =
# base64 of the Developer ID Application .p12) — axiroster pattern.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit -p packages/app/tsconfig.json

  # Linux + Windows need no code-signing.
  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare owned Windows OBS runtime
        if: runner.os == 'Windows'
        run: npm run prepare:obs-runtime -- --platform=windows
      - name: Prepare owned Linux OBS runtime
        # Downloads the published, hash-pinned bundle; nothing here compiles OBS.
        # Rebuilds happen out of band (--rebuild) when the pin moves.
        if: runner.os == 'Linux'
        run: npm run prepare:obs-runtime -- --platform=linux
      - name: Sync package version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version -w @axistream/app
          echo "Building AxiStream $VERSION for ${{ matrix.os }}"
      - name: Build + upload to draft release
        # --publish always also uploads the per-platform electron-updater feed.
        # npm run -w changes CWD to the workspace — electron-builder's config and
        # project-dir resolution both need to run from packages/app.
        run: npm -w @axistream/app run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Baked into the main bundle at build time (electron.vite.config.ts define).
          AXI_YT_CLIENT_ID: ${{ secrets.AXI_YT_CLIENT_ID }}
          AXI_YT_CLIENT_SECRET: ${{ secrets.AXI_YT_CLIENT_SECRET }}
      - name: Preserve OBS corresponding source and recipe
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: obs-corresponding-source
          path: |
            resources/obs-runtime/notices/obs-studio-32.1.2-axistream-corresponding-source.tar.xz
            packaging/flatpak/link.axi.AxiStream.OBS.json
          if-no-files-found: error

  # macOS is signed + notarized with the Developer ID Application cert;
  # electron-builder reads the CSC_*/APPLE_* values from the environment.
  build-mac:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Sync package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version -w @axistream/app
          echo "Building AxiStream $VERSION for macOS"
      # electron-builder's createKeychain() makes a temp keychain with a random
      # password, then runs `security set-key-partition-list -k` with the p12
      # password instead (app-builder-lib macCodeSign.js). macOS runner image
      # 20260828 (Darwin 25.6) enforces -k, so signing dies with
      # "SecKeychainUnlock: The user name or passphrase you entered is not correct".
      # Import the cert ourselves and hand electron-builder CSC_KEYCHAIN instead of
      # CSC_LINK, which skips that code path entirely.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}
          keychain: signing_temp
      # electron-builder silently ad-hoc signs when it can't see an identity, which
      # only surfaces minutes later as a notarization rejection. Fail here instead.
      - name: Verify macOS signing identity is visible
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! security find-identity -v -p codesigning signing_temp.keychain | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in signing_temp.keychain"
            security find-identity -v signing_temp.keychain
            exit 1
          fi
      - name: Build, sign & upload to draft release
        run: npm -w @axistream/app run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .keychain suffix required: `security find-identity` won't resolve a bare name.
          CSC_KEYCHAIN: signing_temp.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Baked into the main bundle at build time (electron.vite.config.ts define).
          AXI_YT_CLIENT_ID: ${{ secrets.AXI_YT_CLIENT_ID }}
          AXI_YT_CLIENT_SECRET: ${{ secrets.AXI_YT_CLIENT_SECRET }}

  publish:
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obs-corresponding-source
          path: obs-corresponding-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish release notes
        # Fails the job when RELEASE_NOTES.md has no section for this tag, rather
        # than shipping autogenerated notes. Runs before the compliance upload so
        # a missing section never leaves a half-published release behind.
        run: |
          notes=$(node scripts/release-notes.mjs "$GITHUB_REF_NAME")
          gh release edit "$GITHUB_REF_NAME" --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload OBS source compliance assets
        # The artifact preserves each file's repo-relative dir (resources/...,
        # packaging/...), so a shallow glob would hand gh a directory. Upload the
        # leaf files instead. For `-exec ... +` batching, {} MUST be the final
        # token, so --clobber goes before it: gh accepts the flag pre-positional.
        run: find obs-corresponding-source -type f -exec gh release upload "$GITHUB_REF_NAME" --clobber {} +
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release
        # --latest is explicit: any auxiliary release published later (e.g. the
        # obs-runtime asset host) would otherwise become GitHub's "latest", and
        # electron-updater resolves the feed from /releases/latest — pointing
        # every installed client at a tag that has no latest.yml.
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Announce on Discord
        if: ${{ vars.DISCORD_RELEASE_CHANNEL_ID != '' }}
        run: node scripts/post-discord-release.mjs "${{ vars.DISCORD_RELEASE_CHANNEL_ID }}" "$GITHUB_REF_NAME"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
