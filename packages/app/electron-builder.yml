appId: link.axi.axistream
# Draft-then-promote (axiroster pattern): electron-builder --publish always
# uploads assets + latest-linux.yml (the electron-updater feed) to a DRAFT
# release; the workflow flips draft=false once, atomically.
publish:
  provider: github
  owner: darkharasho
  repo: axistream
  releaseType: draft
productName: AxiStream
# npm workspaces hoist electron to the repo-root node_modules, where
# electron-builder can't discover it — pin the version explicitly.
electronVersion: 31.7.7
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
asar: true
# koffi is the only native module. electron-builder's smart-unpack only
# auto-unpacks packages containing .dll/.exe/.dylib/.so — a bare *.node is not
# matched — so koffi.node stayed INSIDE app.asar. Electron then has to copy it
# to %TEMP%\<guid>.tmp.node on every dlopen, which is what a Windows user's
# crash report showed as the faulting module. Unpack it so the FFI binary is
# loaded from the install directory instead.
asarUnpack:
  - '**/node_modules/koffi/**'
beforePack: ../../scripts/electron-builder-before-pack.cjs
npmRebuild: false            # koffi (the one native dep) ships prebuilds — nothing to rebuild
electronLanguages: [en-US]
# Windows + macOS builds are CI-wired (release.yml matrix) but runtime is
# still experimental — WindowsObsLauncher is untested on real hardware and
# there is no mac OBS launcher yet. The artifacts install and auto-update.
win:
  target: [nsis]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  extraResources:
    # main reads the pinned archive hash from manifest.json at <resourcesPath>/
    # obs-runtime/manifest.json and fails closed without it — ship it alongside
    # the payload, never a second copy of the hash in code.
    - from: ../../resources/obs-runtime/manifest.json
      to: obs-runtime/manifest.json
    - from: ../../resources/obs-runtime/windows
      to: obs-runtime/windows
mac:
  # zip is required alongside dmg — electron-updater's mac feed updates
  # from the zip. Signed with the Developer ID Application cert (CSC_LINK/
  # CSC_KEY_PASSWORD env) and notarized via the APPLE_ID/
  # APPLE_APP_SPECIFIC_PASSWORD env pair.
  target: [dmg, zip]
  icon: build/icon.png
  category: public.app-category.video
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize:
    teamId: YMPSC6RQ4F
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  executableName: axistream
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: AudioVideo
  icon: build/icon.png
  synopsis: Get live on YouTube in three clicks
  maintainer: AxiStream <project96@gmail.com>
  extraResources:
    - from: ../../resources/obs-runtime/linux
      to: obs-runtime/linux
